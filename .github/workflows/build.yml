name: Tauri 构建与发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: tauri-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tauri:
    name: 构建 ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (M 系列芯片)
          - platform: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            artifact_glob: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          # Apple Intel (x86_64 交叉编译)
          - platform: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
            artifact_glob: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          # Windows (MSI，安装时下载 WebView2)
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi
            artifact_glob: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          # Linux (DEB 与 AppImage)
          - platform: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            artifact_glob: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: 配置 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Rust 依赖
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装前端依赖
        run: npm ci

      - name: 同步 package.json 版本号到 Tauri 配置
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const version = pkg.version;
            const tauriConfPath = "src-tauri/tauri.conf.json";
            if (fs.existsSync(tauriConfPath)) {
              const conf = JSON.parse(fs.readFileSync(tauriConfPath, "utf8"));
              conf.version = version;
              fs.writeFileSync(tauriConfPath, JSON.stringify(conf, null, 2) + "\n");
            }
            const cargoPath = "src-tauri/Cargo.toml";
            if (fs.existsSync(cargoPath)) {
              const cargo = fs.readFileSync(cargoPath, "utf8");
              fs.writeFileSync(
                cargoPath,
                cargo.replace(/^version\s*=\s*"[^"]*"/m, `version = "${version}"`)
              );
            }
          '

      - name: 构建 Tauri 安装包
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: classset-${{ matrix.platform }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载各平台构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: classset-*
          merge-multiple: true
          path: release-assets

      - name: 创建或更新 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t assets < <(find release-assets -type f | sort)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "未找到可上传的构建产物" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
